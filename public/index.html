<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA para Roblox - Construa Lógica!</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: none; box-sizing: border-box; }
        textarea { resize: vertical; height: 80px; }
        button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #45a049; }
        #status { margin-top: 20px; padding: 10px; background: #2d2d2d; border-left: 4px solid #4CAF50; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Controlador IA - Roblox Construa Lógica!</h2>
    
    <label for="sid">Session ID (SID):</label>
    <input type="text" id="sid" value="meupainel1" placeholder="Ex: meupainel1">

    <label for="prompt">Pergunta para a IA:</label>
    <textarea id="prompt" placeholder="Digite uma mensagem curta para o jogo..."></textarea>

    <button onclick="enviarPergunta()">Enviar para o Jogo</button>

    <h3>Status / Resposta:</h3>
    <div id="status">Aguardando envio...</div>

    <script>
        async function enviarPergunta() {
            const sid = document.getElementById('sid').value.trim() || 'default';
            const prompt = document.getElementById('prompt').value.trim();
            const statusDiv = document.getElementById('status');

            if (!prompt) {
                statusDiv.innerText = "Erro: Digite uma pergunta antes de enviar.";
                return;
            }

            statusDiv.innerText = "Enviando para a IA...";

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, sid })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido no servidor.');
                }

                statusDiv.innerText = "Sucesso! Resposta na fila: " + data.reply;
            } catch (err) {
                statusDiv.innerText = "Erro: " + err.message;
            }
        }
    </script>
</body>
</html>
